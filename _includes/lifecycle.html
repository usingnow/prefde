<section class="life-wrap">
  <h2 class="life__label">一次悬赏的路径</h2>
  <ol class="life">
    <li class="life__step">
      <span class="life__no">01</span>
      <h3 class="life__title">发布</h3>
      <p class="life__desc">题目、奖励、门槛、截止时间上线，报名入口同时打开。</p>
    </li>
    <li class="life__step">
      <span class="life__no">02</span>
      <h3 class="life__title">报名与投稿</h3>
      <p class="life__desc">用 GitHub 账号登记意向；截止前把作品提成 Pull Request。</p>
    </li>
    <li class="life__step">
      <span class="life__no">03</span>
      <h3 class="life__title">截止</h3>
      <p class="life__desc">投稿关闭，页面状态转为「评审中」。</p>
      <p class="life__fail">未达门槛 → 流标，不发奖金，作品仍归作者</p>
    </li>
    <li class="life__step">
      <span class="life__no">04</span>
      <h3 class="life__title">评审</h3>
      <p class="life__desc">按题目公布的维度打分，过程在 Pull Request 里公开。</p>
    </li>
    <li class="life__step">
      <span class="life__no">05</span>
      <h3 class="life__title">兑现</h3>
      <p class="life__desc">选出一人，页面公示，并留下可查的兑现记录。</p>
    </li>
  </ol>
</section>
