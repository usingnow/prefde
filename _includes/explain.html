<section class="explain">
  <div class="explain__item">
    <h3 class="explain__title"><span class="explain__no">01</span>如何参加</h3>
    <p class="explain__body">在当期页面点「我要报名」，用 GitHub 账号登记；截止前把作品提成 Pull Request。报名不收费，也不构成必须交稿的义务。</p>
    <p class="explain__more"><a href="{{ '/faq/' | relative_url }}">报名与投稿步骤 →</a></p>
  </div>

  <div class="explain__item">
    <h3 class="explain__title"><span class="explain__no">02</span>怎么算成团</h3>
    <p class="explain__body">门槛数的是<em class="hl">投稿数</em>，不是报名数。达到门槛悬赏才算成立、进入评审；没达到则流标，不发奖金，作品仍归作者。报名数只用来展示热度。</p>
    <p class="explain__more"><a href="{{ '/faq/' | relative_url }}#%E7%8A%B6%E6%80%81%E6%98%AF%E4%BB%80%E4%B9%88%E6%84%8F%E6%80%9D">状态是什么意思 →</a></p>
  </div>

  <div class="explain__item">
    <h3 class="explain__title"><span class="explain__no">03</span>奖金怎么发</h3>
    <p class="explain__body">每期由我们评审，选出一人，结果在页面上公示。兑现后会在当期页面留下兑现记录链接。评审维度写在题目里，过程在 Pull Request 里公开。</p>
    <p class="explain__more"><a href="{{ '/faq/' | relative_url }}#%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%85%91%E7%8E%B0">评审与兑现 →</a></p>
  </div>
</section>
