{%- assign nav_cur = site.bounties | where: "status", "open" | sort: "opens" | last -%}
{%- if nav_cur == nil -%}{%- assign nav_cur = site.bounties | sort: "opens" | last -%}{%- endif -%}
<header class="site-head">
  <div class="wrap site-head__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__logo" src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="44" height="44">
      <span class="brand__name">{{ site.title }}</span>
    </a>
    <nav class="nav">
      {%- if nav_cur %}
      <a class="nav__primary" href="{{ nav_cur.url | relative_url }}">当期</a>
      <span class="nav__sep" aria-hidden="true"></span>
      {%- endif %}
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/faq/' | relative_url }}">说明</a>
      <a href="{{ '/archive/' | relative_url }}">归档</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </div>
</header>
