name: B1 无title
description: 二分排查用，确认后删除（B1 无title）
labels: ["报名"]
body:
  - type: markdown
    attributes:
      value: |
        **报名后请在截止前提交作品**：PR 到 `_submissions/<期号>/你的GitHub用户名.md`。
        评审结果会直接回复在这条 issue 下，请保持订阅。

        一期内每人只开一条，重复的会被手动关闭。
  - type: input
    id: bounty
    attributes:
      label: 期号
      description: 形如 2026-11-17，见悬赏页标题下方
      placeholder: "2026-11-17"
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 你打算怎么做
      description: 一两句话即可，用于评审时了解你的思路
      placeholder: 用 Rust 写一个 CLI，支持 OPML 导入……
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我会在截止时间前提交，且作品为本人原创
          required: true
