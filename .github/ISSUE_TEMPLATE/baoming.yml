name: 报名表
description: 报名参加本期悬赏
title: "[报名] "
labels: ["报名"]
body:
  - type: markdown
    attributes:
      value: |
        **报名后请在截止前提交作品**：PR 到 `_submissions/<期号>/你的GitHub用户名.md`。
        评审结果会直接回复在这条 issue 下，请保持订阅。

        一期内每人只开一条，重复的会被手动关闭。
  - type: input
    id: bounty
    attributes:
      label: 期号
      description: 形如 2026-11-17，见悬赏页标题下方
      placeholder: "2026-11-17"
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 你打算怎么做
      description: 一两句话即可，用于评审时了解你的思路
      placeholder: 用 Rust 写一个 CLI，支持 OPML 导入……
    validations:
      required: true
  - type: checkboxes
    id: eligible
    attributes:
      label: 资格确认
      description: 这个站面向在校学生。不符也欢迎参与讨论，但不进入评奖。
      options:
        - label: 我是在校学生（计算机 / 软件 / 数学 / 统计 / 经济等相关专业）
          required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我会在截止时间前提交，且作品为本人原创
          required: true
