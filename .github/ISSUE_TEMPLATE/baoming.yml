name: 报名表
description: 报名参加本期悬赏
title: "[报名] "
labels: ["报名"]
body:
  - type: markdown
    attributes:
      value: |
        **报名前请先读完整题目**：页面上的题目、交付要求、评审标准与规则都要看一遍，下面会逐项确认。

        **报名后请在截止前提交作品**：PR 到 `_submissions/<期号>/你的GitHub用户名.md`。
        评审结果会直接回复在这条 issue 下，请保持订阅。

        一期内每人只开一条，重复的会被手动关闭。
  - type: input
    id: bounty
    attributes:
      label: 期号
      description: 见悬赏页标题下方，形如 2026-11-19-odoo-01
      placeholder: "2026-11-19-odoo-01"
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 你打算怎么做
      description: 一两句话即可，用于评审时了解你的思路
      placeholder: 用 Rust 写一个 CLI，支持 OPML 导入……
    validations:
      required: true
  - type: checkboxes
    id: read
    attributes:
      label: 阅读确认
      description: 三项都要勾选才能提交。
      options:
        - label: 我已完整阅读本期的题目、交付要求、评审标准与规则
          required: true
        - label: 我理解悬赏须达到投稿门槛才成立；未达门槛则流标，不发放奖金；评审结果为最终结果
          required: true
        - label: 我知悉作品会在评审期间公开展示；参与悬赏不构成雇佣或劳务关系，奖励的税费按国家有关规定处理
          required: true
  - type: checkboxes
    id: eligible
    attributes:
      label: 资格确认
      description: 这个站面向在校学生。不符也欢迎参与讨论，但不进入评奖。
      options:
        - label: 我是在校学生（计算机 / 软件 / 数学 / 统计 / 经济等相关专业）
          required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我会在截止时间前提交，且作品为本人原创
          required: true
