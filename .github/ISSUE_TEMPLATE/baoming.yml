name: 报名表
description: 请从悬赏页的「我要报名」进入；直接打开不会带期号
title: "[报名] "
labels: ["报名"]
body:
  - type: markdown
    attributes:
      value: |
        **请从悬赏页的「我要报名」进入这张表。**
        直接通过模板列表打开不会带期号，无法对应到具体一期，管理员会关闭。

        标题已经带上「期号 + 题目」，请不要修改。投稿目录用标题里的期号：
        `_submissions/<期号>/你的GitHub用户名.md`

        题目、交付要求、评审标准与规则都在悬赏页上；截止时间以悬赏页为准。
        评审结果会直接回复在这条 issue 下，请保持订阅。

        一期内每人只开一条，重复的会被手动关闭。
  - type: textarea
    id: plan
    attributes:
      label: 你打算怎么做
      description: 一两句话即可，用于评审时了解你的思路。不需要写完整方案。
      placeholder: 请用简洁明了的方式描述你的大致解题思路。
    validations:
      required: true
  - type: checkboxes
    id: read
    attributes:
      label: 阅读确认
      description: 三项都要勾选才能提交。
      options:
        - label: 我已完整阅读本期的题目、交付要求、评审标准与规则
          required: true
        - label: 我理解悬赏须达到投稿门槛才成立；未达门槛则流标，不发放奖金；评审结果为最终结果
          required: true
        - label: 我知悉作品会在评审期间公开展示；参与悬赏不构成雇佣或劳务关系，奖励的税费按国家有关规定处理
          required: true
  - type: checkboxes
    id: eligible
    attributes:
      label: 资格确认
      description: 这个站面向在校学生。不符也欢迎参与讨论，但不进入评奖。
      options:
        - label: 我是在校学生（计算机 / 软件 / 数学 / 统计 / 经济等相关专业）
          required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我会在截止时间前提交，且作品为本人原创
          required: true
