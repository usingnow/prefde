title: PreFDE 加油站
tagline: 一期一题，满额成团
description: 面向计算机、数学、统计、经济等专业在校学生的悬赏板。报名与投稿达到门槛后，悬赏成立，评审一人兑现。
url: "https://prefde.usingnow.tech"
baseurl: ""

# 不依赖 site.github（jekyll-github-metadata 本地预览需要 token），
# 改用显式配置，本地与 Pages 行为一致。
repo: "usingnow/prefde"
repo_url: "https://github.com/usingnow/prefde"
branch: "main"

timezone: Asia/Shanghai
lang: zh-CN

collections:
  bounties:
    output: true
    permalink: /b/:name/

defaults:
  - scope:
      path: ""
      type: bounties
    values:
      layout: bounty

# giscus 评论区：到 https://giscus.app/zh-CN 生成 repo_id / category_id 后填入
giscus:
  repo: "usingnow/prefde"
  repo_id: "R_kgDOVzH7Aw"            # R_xxxxxxxx
  category: "Announcements"
  category_id: "DIC_kwDOVzH7A84DLbjo"        # DIC_xxxxxxxx

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed
  sass_dir: _sass

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - docs
  - vendor
